<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Revival — Firebase Login Test</title><style>body{font-family:system-ui,sans-serif;max-width:580px;margin:50px auto;padding:18px;line-height:1.6}button{font-size:17px;padding:12px 18px;margin:8px 8px 8px 0;border-radius:8px}#status{padding:14px;background:#f3f5f7;border-radius:8px;overflow-wrap:anywhere}</style></head><body><h1>Morning Revival · 로그인 확인</h1><p>이번 주 Morning Revival 운영 사이트와 데이터는 변경하지 않습니다. 이 페이지는 Google 로그인 및 Firebase Authentication 사용자 생성만 시험합니다. Firestore에 기록을 저장하지 않습니다.</p><button id="login" disabled>Google 로그인</button><button id="logout" disabled>로그아웃</button><p id="status" role="status">Firebase 연결 준비 중…</p><p><strong>확인:</strong> 로그인 후 Firebase 콘솔 → Authentication → 사용자에서 새로고침하세요. UID는 콘솔에서 확인하면 됩니다.</p><script src="./firebase-config.js"></script><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';const s=document.getElementById('status'),li=document.getElementById('login'),lo=document.getElementById('logout');try{if(!window.MR_FIREBASE_CONFIG)throw Error('Firebase 설정 파일 없음');const app=initializeApp(window.MR_FIREBASE_CONFIG);const auth=getAuth(app);li.onclick=async()=>{try{s.textContent='Google 로그인 진행 중…';await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){s.textContent='로그인 오류: '+e.code+' — '+e.message}};lo.onclick=async()=>{try{await signOut(auth)}catch(e){s.textContent='로그아웃 오류: '+e.message}};onAuthStateChanged(auth,u=>{li.disabled=!!u;lo.disabled=!u;s.textContent=u?'로그인 성공 — 이메일: '+(u.email||'표시 없음')+' / Firebase UID: '+u.uid:'로그인하지 않았습니다. Google 로그인 버튼을 누르세요.'});}catch(e){s.textContent='초기화 오류: '+e.message}</script></body></html>
