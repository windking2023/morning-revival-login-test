<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Revival · 가족 전용 시험판</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#f7f4ee;color:#29241e;margin:0}main{max-width:720px;margin:5vh auto;padding:24px;background:white;border-radius:14px}button{padding:10px 16px;margin:6px;border-radius:8px;border:1px solid #aaa;background:#eee;cursor:pointer}textarea{width:100%;min-height:100px;box-sizing:border-box}pre{white-space:pre-wrap;word-break:break-word;background:#f6f6f6;padding:12px}#private{display:none}</style></head><body><main><h1>Morning Revival · 가족 전용 시험판</h1><p>공개 페이지에는 실제 아침부흥 본문이 포함되어 있지 않습니다.</p><p id="state">설정 확인 중…</p><button id="login">Google 로그인</button><button id="logout" hidden>로그아웃</button><div><button id="security-test">접근 차단 시험</button></div><pre id="security-result" aria-live="polite">시험 버튼을 누르면 Firestore 서버의 읽기 허용·거부 결과가 표시됩니다.</pre><section id="private"><h2>보호된 시험 본문</h2><pre id="content">불러오는 중…</pre><h2>개인 시험 노트</h2><textarea id="note" placeholder="시험 문구만 입력하세요. 실제 개인 기록은 아직 이전하지 마세요."></textarea><div><button id="save">노트 저장</button><button id="load">노트 다시 불러오기</button></div></section><p id="error" role="alert"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id);let auth,db,user;
const err=e=>{$('error').textContent=e?.code?`${e.code}: ${e.message}`:String(e)};
try{if(firebaseConfig.apiKey.startsWith('PASTE_'))throw new Error('먼저 firebase-config.js에 실제 Firebase API 키를 입력하세요.');const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
$('login').onclick=async()=>{try{$('error').textContent='';await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){err(e)}};
$('logout').onclick=async()=>{try{await signOut(auth)}catch(e){err(e)}};
$('security-test').onclick=async()=>{const out=$('security-result');out.textContent='Firestore 서버에 읽기 요청 중…';try{const result=await getDoc(doc(db,'privateContent','test-week1'));out.textContent=result.exists()?'읽기 성공: 서버에서 보호 문서 읽기를 허용했습니다.':'읽기 허용됨: 문서가 존재하지 않습니다.'}catch(e){out.textContent=e.code==='permission-denied'?'접근 거부 확인: Firestore 서버가 읽기 요청을 거부했습니다. (permission-denied)':`시험 오류 (${e.code||'unknown'}): ${e.message||e}`}};
const load=async()=>{if(!user)return;try{const [content,note]=await Promise.all([getDoc(doc(db,'privateContent','test-week1')),getDoc(doc(db,'users',user.uid,'notes','pilot'))]);$('content').textContent=content.exists()?content.data().text:'시험 본문 없음: Firestore privateContent/test-week1 문서를 관리자에게 설정받으세요.';$('note').value=note.exists()?(note.data().text||''):'';$('error').textContent=''}catch(e){$('content').textContent='접근 거부 또는 설정 오류';err(e)}};
$('load').onclick=load;$('save').onclick=async()=>{if(!user)return;try{await setDoc(doc(db,'users',user.uid,'notes','pilot'),{text:$('note').value,updatedAt:new Date().toISOString()});$('error').textContent='시험 노트 저장 성공'}catch(e){err(e)}};
onAuthStateChanged(auth,async u=>{user=u;$('login').hidden=!!u;$('logout').hidden=!u;$('private').style.display=u?'block':'none';$('state').textContent=u?`로그인: ${u.email}`:'로그인해야 시험할 수 있습니다.';if(u)await load();else{$('content').textContent='';$('note').value=''}},err);
}catch(e){$('state').textContent='설정 필요';err(e)}
</script></body></html>
